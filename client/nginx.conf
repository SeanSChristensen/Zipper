upstream api {
    least_conn;                 # send each request to the least-busy instance
    server api:3001 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    client_max_body_size 100m;  # default is 1 MB; match the multer limit

    root /usr/share/nginx/html;
    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://api;
        proxy_read_timeout 120s;      # big files take a while to gzip
        proxy_request_buffering off;  # stream uploads instead of buffering them in nginx
    }
}